# Mana official website settings.
#
# `documents/pages/<language>/` holds the manuscripts and `build-pages.py`
# renders them. The site introduces Mana; the manual itself lives in the Wiki.

title: Mana
tagline: Actor-oriented scripting language for game events

default_language: ja

# The site root opens the reader's language when the site has it: the one
# they picked on the site before, otherwise their browser's first language.
# Everyone else gets this language.
fallback_language: en

languages:
  ja:
    label: 日本語
    html_lang: ja
  en:
    label: English
    html_lang: en
    optional: true

# `wiki:Tutorial` in a manuscript becomes a link to this Wiki.
wiki:
  url: https://github.com/shun126/Mana/wiki

repository:
  url: https://github.com/shun126/Mana

theme:
  layout: theme/base.html
  stylesheet: theme/site.css

# Google Analytics (GA4). Every generated page, the Playground included,
# loads the Google tag for this measurement ID, and every page footer tells
# readers so in the page's language (inline Markdown). Leave the ID empty to
# build the site without the tag or the notice.
analytics:
  measurement_id: G-SNQZ20NY5W
  notice:
    ja: このサイトは、利用状況を把握するために Cookie を使う Google Analytics を利用しています（[Google によるデータの使用](https://policies.google.com/technologies/partner-sites?hl=ja)）。
    en: This site uses Google Analytics, which sets cookies, to understand how it is used ([how Google uses this data](https://policies.google.com/technologies/partner-sites)).
