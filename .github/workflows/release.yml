name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate tag and version
        run: python3 .github/scripts/release.py validate "$GITHUB_REF_NAME"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex cmake g++ make python3

      - name: Configure release build
        run: |
          export BISON_EXECUTABLE="$(command -v bison)"
          export FLEX_EXECUTABLE="$(command -v flex)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Run release tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create source packages
        run: python3 .github/scripts/release.py package "$GITHUB_REF_NAME"

      - name: Create draft release with assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
