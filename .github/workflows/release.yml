name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate tag and version
        run: python3 .github/scripts/release.py validate "$RELEASE_TAG"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex cmake g++ make python3
      - name: Build and test
        run: |
          export BISON_EXECUTABLE="$(command -v bison)"
          export FLEX_EXECUTABLE="$(command -v flex)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Create source packages
        run: python3 .github/scripts/release.py package "$RELEASE_TAG"
      - name: Stage generated sources for Windows
        run: |
          mkdir -p generated-for-windows/compiler generated-for-windows/runner/common
          cp build/generated/Parser.cpp build/generated/Parser.hpp build/generated/Lexer.cpp generated-for-windows/compiler/
          cp runner/common/Version.h generated-for-windows/runner/common/
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: generated-for-windows
          path: generated-for-windows/
          if-no-files-found: error

  binaries:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: ubuntu-x64
            binary: build/mana
          - os: macos-15-intel
            platform: macos-x64
            binary: build/mana
          - os: macos-15
            platform: macos-arm64
            binary: build/mana
          - os: windows-2022
            platform: windows-x86
            architecture: Win32
            binary: build/Release/mana.exe
          - os: windows-2022
            platform: windows-x64
            architecture: x64
            binary: build/Release/mana.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and version
        shell: bash
        run: python .github/scripts/release.py validate "$RELEASE_TAG"
      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex cmake g++ make
          echo "BISON_EXECUTABLE=$(command -v bison)" >> "$GITHUB_ENV"
          echo "FLEX_EXECUTABLE=$(command -v flex)" >> "$GITHUB_ENV"
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "BISON_EXECUTABLE=$(brew --prefix bison)/bin/bison" >> "$GITHUB_ENV"
          echo "FLEX_EXECUTABLE=$(brew --prefix flex)/bin/flex" >> "$GITHUB_ENV"
      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
      - name: Download generated sources for Windows
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: generated-for-windows
          path: .
      - name: Configure Unix build
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure Windows build
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A ${{ matrix.architecture }} -DMANA_USE_PREGENERATED_SOURCES=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Create executable archive
        shell: bash
        run: python .github/scripts/release.py binary "$RELEASE_TAG" --platform "${{ matrix.platform }}" --binary-path "${{ matrix.binary }}"
      - name: Upload executable archive
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  draft:
    needs: [source, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: release-binary-*
          path: dist
          merge-multiple: true
      - name: Verify release archives
        run: python3 .github/scripts/release.py verify-assets "$RELEASE_TAG"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --draft --verify-tag --generate-notes --title "Mana $RELEASE_TAG"
