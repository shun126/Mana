name: build
on: [push]
jobs:
  BuildOnUbuntu:
    runs-on: ubuntu-latest
    # DebugとReleaseの両方を回します。表明はReleaseのNDEBUGで消えるので、
    # Releaseだけでは不変条件が壊れるバグを取り逃します。
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bison flex clang cmake make python3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set tool environment variables
        run: |
          echo "BISON_EXECUTABLE=$(command -v bison)" >> "$GITHUB_ENV"
          echo "FLEX_EXECUTABLE=$(command -v flex)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  BuildOnWindows:
    runs-on: windows-latest
    # 32ビットと64ビット、デバッグとリリースの4通りを必ず回します。
    # ポインタ幅に依存する不具合と、表明が有効な構成でしか出ない不具合を
    # 取り逃がさない為です。
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
        configuration: [Debug, Release]
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Set up Cygwin
        uses: egor-tensin/setup-cygwin@v4
        with:
          platform: x64
          packages: bison flex
      - name: Add Environment variables
        run: |
          echo "BISON_EXECUTABLE=C:\tools\cygwin\bin\bison.exe" >> $env:GITHUB_ENV
          echo "FLEX_EXECUTABLE=C:\tools\cygwin\bin\flex.exe" >> $env:GITHUB_ENV
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.platform }}
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cppcheck
        uses: deep5050/cppcheck-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          inline_suppression: enable
          std: c++17
