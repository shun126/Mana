    <text x="98" y="92" text-anchor="middle" class="label" fill="#3e92e8">0101</text>
    <text x="98" y="118" text-anchor="middle" class="label" fill="#3e92e8">1010</text>
    <text x="98" y="144" text-anchor="middle" class="label" fill="#3e92e8">0101</text>
    <text x="95" y="192" text-anchor="middle" class="h2">Program Image</text>
    <text x="95" y="252" text-anchor="middle" class="small">Intermediate form</text>
