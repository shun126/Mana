    <circle cx="126" cy="146" r="5" fill="#fff"/>
    <line x1="74" y1="136" x2="74" y2="164" stroke="#fff" stroke-width="6"/>
    <line x1="60" y1="150" x2="88" y2="150" stroke="#fff" stroke-width="6"/>
    <line x1="128" y1="94" x2="140" y2="82" stroke="#3e92e8" stroke-width="6" stroke-linecap="round"/>
    <line x1="112" y1="84" x2="112" y2="70" stroke="#3e92e8" stroke-width="6" stroke-linecap="round"/>
