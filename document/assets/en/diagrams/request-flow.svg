<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><style>
    .title{font:700 44px Arial,Helvetica,sans-serif; fill:#0f2547}
    .h2{font:700 20px Arial,Helvetica,sans-serif; fill:#0f2547}
    .label{font:700 18px Arial,Helvetica,sans-serif; fill:#0f2547}
    .small{font:400 16px Arial,Helvetica,sans-serif; fill:#38506f}
    .box{fill:#eef7ff;stroke:#3e92e8;stroke-width:4}
    .arrow{stroke:#3e92e8;stroke-width:6;fill:none;marker-end:url(#m)}
  </style><marker id="m" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3e92e8"/></marker></defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="70" y="88" class="title">How a request flows</text>
  <rect x="70" y="104" width="160" height="10" rx="5" fill="#9fd0fa"/>
  <g transform="translate(70,210)">
    <rect class="box" x="0" y="0" width="230" height="220" rx="24"/>
    <circle cx="115" cy="74" r="28" fill="#3e92e8"/>
    <path d="M73 146 C78 112,152 112,157 146 Z" fill="#3e92e8"/>
    <text x="115" y="176" text-anchor="middle" class="h2" style="font-size:34px">Player</text>
  </g>
  <text x="410" y="320" style="font:400 28px 'Courier New',monospace; fill:#0f2547">request(10, Door-&gt;open)</text>
  <path class="arrow" d="M320 345 H780"/>
  <g transform="translate(800,190)">
    <rect class="box" x="0" y="0" width="320" height="240" rx="24"/>
    <text x="160" y="62" text-anchor="middle" class="h2" style="font-size:32px">Door</text>
    <rect x="36" y="100" width="248" height="100" rx="18" fill="#fff" stroke="#b3d4f6" stroke-width="3"/>
    <circle cx="102" cy="150" r="24" fill="#3e92e8"/>
    <circle cx="102" cy="150" r="10" fill="#fff"/>
    <g stroke="#3e92e8" stroke-width="8" stroke-linecap="round">
      <line x1="102" y1="112" x2="102" y2="124"/>
      <line x1="102" y1="176" x2="102" y2="188"/>
      <line x1="64" y1="150" x2="76" y2="150"/>
      <line x1="128" y1="150" x2="140" y2="150"/>
    </g>
    <text x="162" y="146" class="small">action</text>
    <text x="210" y="146" class="label" fill="#3e92e8">open</text>
  </g>
  <g transform="translate(86,520)">
    <circle cx="0" cy="0" r="24" fill="#3e92e8"/><text x="0" y="8" text-anchor="middle" style="font:700 24px Arial; fill:#fff">1</text>
    <text x="46" y="8" class="label">10 = Priority</text>
    <circle cx="0" cy="76" r="24" fill="#3e92e8"/><text x="0" y="84" text-anchor="middle" style="font:700 24px Arial; fill:#fff">2</text>
    <text x="46" y="84" class="label">Door-&gt;open = a reference to the open Action of the Door Actor</text>
    <circle cx="0" cy="152" r="24" fill="#3e92e8"/><text x="0" y="160" text-anchor="middle" style="font:700 24px Arial; fill:#fff">3</text>
    <text x="46" y="160" class="label">request asks another Actor to run one of its Actions</text>
  </g>
</svg>
