<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820">
  <defs><style>
    .title{font:700 42px Arial,Helvetica,sans-serif; fill:#0f2547}
    .head{font:700 28px Arial,Helvetica,sans-serif; fill:#0f2547}
    .label{font:700 16px Arial,Helvetica,sans-serif; fill:#0f2547}
    .small{font:400 15px Arial,Helvetica,sans-serif; fill:#38506f}
    .card{fill:#fff;stroke:#cfe3f8;stroke-width:2}
    .band{fill:#eef7ff}
  </style><marker id="m" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f2547"/></marker></defs>
  <rect width="1320" height="820" fill="#fff"/>
  <text x="70" y="84" class="title">request, awaitStart and awaitCompletion</text>
  <g transform="translate(24,160)">
    <rect class="card" x="0" y="0" width="400" height="520" rx="18"/>
    <rect class="band" x="0" y="0" width="400" height="78" rx="18"/>
    <text x="200" y="48" text-anchor="middle" class="head">request</text>
    <rect x="26" y="110" width="132" height="70" rx="10" fill="#eef7ff" stroke="#3e92e8" stroke-width="2"/>
    <rect x="242" y="110" width="132" height="70" rx="10" fill="#eef7ff" stroke="#3e92e8" stroke-width="2"/>
    <text x="92" y="151" text-anchor="middle" class="label">Caller</text>
    <text x="308" y="151" text-anchor="middle" class="label">Target</text>
    <line x1="92" y1="180" x2="92" y2="356" stroke="#8da8c2" stroke-dasharray="8 8" stroke-width="2"/>
    <line x1="308" y1="180" x2="308" y2="356" stroke="#8da8c2" stroke-dasharray="8 8" stroke-width="2"/>
    <line x1="92" y1="246" x2="306" y2="246" stroke="#0f2547" stroke-width="3" marker-end="url(#m)"/>
    <text x="198" y="230" text-anchor="middle" class="small">Request an Action</text>
    <circle cx="46" cy="418" r="22" fill="#9fd0fa"/><text x="46" y="426" text-anchor="middle" class="label">1</text>
    <text x="92" y="426" class="head" style="font-size:18px">Send the request</text>
    <circle cx="46" cy="490" r="22" fill="#9fd0fa"/><text x="46" y="498" text-anchor="middle" class="label">2</text>
    <text x="92" y="494" class="label">The Caller carries on at once</text>
  </g>
  <g transform="translate(460,160)">
    <rect class="card" x="0" y="0" width="400" height="520" rx="18"/>
    <rect class="band" x="0" y="0" width="400" height="78" rx="18"/>
    <text x="200" y="48" text-anchor="middle" class="head">awaitStart</text>
    <rect x="26" y="110" width="132" height="70" rx="10" fill="#eef7ff" stroke="#3e92e8" stroke-width="2"/>
    <rect x="242" y="110" width="132" height="70" rx="10" fill="#eef7ff" stroke="#3e92e8" stroke-width="2"/>
    <text x="92" y="151" text-anchor="middle" class="label">Caller</text>
    <text x="308" y="151" text-anchor="middle" class="label">Target</text>
    <line x1="92" y1="180" x2="92" y2="356" stroke="#8da8c2" stroke-dasharray="8 8" stroke-width="2"/>
    <line x1="308" y1="180" x2="308" y2="356" stroke="#8da8c2" stroke-dasharray="8 8" stroke-width="2"/>
    <line x1="92" y1="246" x2="306" y2="246" stroke="#0f2547" stroke-width="3" marker-end="url(#m)"/>
    <text x="198" y="230" text-anchor="middle" class="small">Request an Action</text>
    <circle cx="308" cy="288" r="20" fill="#fff" stroke="#3e92e8" stroke-width="3"/>
    <polygon points="302,278 318,288 302,298" fill="#3e92e8"/>
    <text x="338" y="294" class="small">Start</text>
    <line x1="306" y1="340" x2="94" y2="340" stroke="#0f2547" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#m)"/>
    <text x="200" y="326" text-anchor="middle" class="small">Resume once started</text>
    <circle cx="46" cy="418" r="22" fill="#9fd0fa"/><text x="46" y="426" text-anchor="middle" class="label">1</text>
    <text x="92" y="426" class="head" style="font-size:18px">Send the request</text>
    <circle cx="46" cy="466" r="22" fill="#9fd0fa"/><text x="46" y="474" text-anchor="middle" class="label">2</text>
    <text x="92" y="468" class="label">Wait until the Target starts</text>
    <circle cx="46" cy="514" r="22" fill="#9fd0fa"/><text x="46" y="522" text-anchor="middle" class="label">3</text>
    <text x="92" y="516" class="label">Then the Caller resumes</text>
  </g>
  <g transform="translate(896,160)">
    <rect class="card" x="0" y="0" width="400" height="520" rx="18"/>
    <rect class="band" x="0" y="0" width="400" height="78" rx="18"/>
    <text x="200" y="48" text-anchor="middle" class="head">awaitCompletion</text>
    <rect x="26" y="110" width="132" height="70" rx="10" fill="#eef7ff" stroke="#3e92e8" stroke-width="2"/>
    <rect x="242" y="110" width="132" height="70" rx="10" fill="#eef7ff" stroke="#3e92e8" stroke-width="2"/>
    <text x="92" y="151" text-anchor="middle" class="label">Caller</text>
    <text x="308" y="151" text-anchor="middle" class="label">Target</text>
    <line x1="92" y1="180" x2="92" y2="356" stroke="#8da8c2" stroke-dasharray="8 8" stroke-width="2"/>
    <line x1="308" y1="180" x2="308" y2="356" stroke="#8da8c2" stroke-dasharray="8 8" stroke-width="2"/>
    <line x1="92" y1="246" x2="306" y2="246" stroke="#0f2547" stroke-width="3" marker-end="url(#m)"/>
    <text x="198" y="230" text-anchor="middle" class="small">Request an Action</text>
    <circle cx="308" cy="306" r="20" fill="#fff" stroke="#3e92e8" stroke-width="3"/>
    <path d="M296 306 l8 8 l14 -18" fill="none" stroke="#3e92e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="338" y="312" class="small">Done</text>
    <line x1="306" y1="352" x2="94" y2="352" stroke="#0f2547" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#m)"/>
    <text x="198" y="338" text-anchor="middle" class="small">Resume once done</text>
    <circle cx="46" cy="418" r="22" fill="#9fd0fa"/><text x="46" y="426" text-anchor="middle" class="label">1</text>
    <text x="92" y="426" class="head" style="font-size:18px">Send the request</text>
    <circle cx="46" cy="466" r="22" fill="#9fd0fa"/><text x="46" y="474" text-anchor="middle" class="label">2</text>
    <text x="92" y="468" class="label">Wait until the Target finishes</text>
    <circle cx="46" cy="514" r="22" fill="#9fd0fa"/><text x="46" y="522" text-anchor="middle" class="label">3</text>
    <text x="92" y="516" class="label">Then the Caller resumes</text>
  </g>
  <g transform="translate(40,710)">
    <rect x="0" y="0" width="1240" height="82" rx="18" fill="#eef7ff" stroke="#cfe3f8" stroke-width="2"/>
    <circle cx="52" cy="41" r="20" fill="#fff" stroke="#3e92e8" stroke-width="3"/>
    <line x1="52" y1="29" x2="52" y2="51" stroke="#3e92e8" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="41" x2="64" y2="41" stroke="#3e92e8" stroke-width="4" stroke-linecap="round"/>
    <text x="98" y="49" class="head" style="font-size:20px">All three ask an Actor to run an Action; they differ only in when the Caller waits.</text>
  </g>
</svg>
