<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><style>
    .title{font:700 44px Arial,Helvetica,sans-serif; fill:#0f2547}
    .h2{font:700 22px Arial,Helvetica,sans-serif; fill:#0f2547}
    .label{font:700 17px Arial,Helvetica,sans-serif; fill:#0f2547}
    .small{font:400 16px Arial,Helvetica,sans-serif; fill:#38506f}
    .box{fill:#eef7ff;stroke:#3e92e8;stroke-width:4}
    .card{fill:#fff;stroke:#7cb6f0;stroke-width:3}
  </style></defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="86" text-anchor="middle" class="title">How Actor and Action relate</text>
  <rect x="440" y="102" width="320" height="10" rx="5" fill="#9fd0fa"/>
  <g transform="translate(90,145)">
    <rect class="box" x="0" y="0" width="540" height="485" rx="34"/>
    <path d="M64 62 l44 10 v72 l-44 10 l-22 -18 v-56 z" fill="#3e92e8" opacity="0.9"/>
    <line x1="97" y1="82" x2="97" y2="132" stroke="#fff" stroke-width="6"/>
    <circle cx="94" cy="107" r="4" fill="#fff"/>
    <text x="230" y="104" class="title" style="font-size:34px">Actor: Door</text>
    <g transform="translate(60,140)">
      <rect class="card" x="0" y="0" width="380" height="92" rx="16"/>
      <text x="190" y="38" text-anchor="middle" style="font:700 16px Arial; fill:#3e92e8">action</text>
      <text x="190" y="68" text-anchor="middle" style="font:700 30px Arial; fill:#0f2547">init</text>
    </g>
    <g transform="translate(60,252)">
      <rect class="card" x="0" y="0" width="380" height="92" rx="16"/>
      <text x="190" y="38" text-anchor="middle" style="font:700 16px Arial; fill:#3e92e8">action</text>
      <text x="190" y="68" text-anchor="middle" style="font:700 30px Arial; fill:#0f2547">main</text>
    </g>
    <g transform="translate(60,364)">
      <rect class="card" x="0" y="0" width="380" height="92" rx="16"/>
      <text x="190" y="38" text-anchor="middle" style="font:700 16px Arial; fill:#3e92e8">action</text>
      <text x="190" y="68" text-anchor="middle" style="font:700 30px Arial; fill:#0f2547">open</text>
    </g>
  </g>
  <g transform="translate(710,255)">
    <rect x="0" y="0" width="380" height="240" rx="22" fill="#f6fbff" stroke="#7cb6f0" stroke-width="3"/>
    <circle cx="56" cy="54" r="22" fill="#3e92e8"/>
    <text x="56" y="61" text-anchor="middle" style="font:700 22px Arial; fill:#fff">i</text>
    <text x="96" y="62" class="h2" fill="#3e92e8">Key points</text>
    <circle cx="56" cy="114" r="6" fill="#3e92e8"/>
    <text x="84" y="120" class="label">Actor = a unit of execution</text>
    <circle cx="56" cy="160" r="6" fill="#3e92e8"/>
    <text x="84" y="166" class="label">Action = what an Actor does</text>
    <circle cx="56" cy="206" r="6" fill="#3e92e8"/>
    <text x="84" y="212" class="label">main / init are special Actions</text>
  </g>
  <text x="600" y="690" text-anchor="middle" class="h2" style="font-size:24px">An Actor runs independently and can have several Actions.</text>
</svg>
