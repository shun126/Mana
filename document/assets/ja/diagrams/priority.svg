<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><style>
    .title{font:700 42px Arial,Helvetica,sans-serif; fill:#0f2547}
    .actor{font:700 22px Arial,Helvetica,sans-serif; fill:#0f2547}
    .lane{font:700 18px Arial,Helvetica,sans-serif; fill:#0f2547}
    .bar{font:700 18px Arial,Helvetica,sans-serif; fill:#0f2547}
    .bar-light{font:700 18px Arial,Helvetica,sans-serif; fill:#ffffff}
    .bar-quiet{font:400 16px Arial,Helvetica,sans-serif; fill:#38506f}
    .note{font:700 18px Arial,Helvetica,sans-serif; fill:#0f2547}
    .small{font:400 16px Arial,Helvetica,sans-serif; fill:#38506f}
    .badge{font:700 20px Arial,Helvetica,sans-serif; fill:#ffffff}
    .run-main{fill:#dff0ff;stroke:#0f2547;stroke-width:2}
    .run-open{fill:#3e92e8;stroke:#0f2547;stroke-width:2}
    .run-close{fill:#9fd0fa;stroke:#0f2547;stroke-width:2}
    .suspended{fill:url(#hatch);stroke:#7a8ea8;stroke-width:2;stroke-dasharray:8 6}
    .waiting{fill:#ffffff;stroke:#7a8ea8;stroke-width:2;stroke-dasharray:8 6}
    .track{stroke:#dbe8f5;stroke-width:2}
    .guide{stroke:#8a9bb0;stroke-width:2;stroke-dasharray:6 6}
  </style>
  <marker id="m" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f2547"/></marker>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f3f8fd"/><line x1="0" y1="0" x2="0" y2="12" stroke="#c7d9ec" stroke-width="6"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="80" text-anchor="middle" class="title">Priority による割り込みと復帰</text>
  <rect x="40" y="120" width="1120" height="300" rx="18" fill="#f6fbff" stroke="#cfe3f8" stroke-width="2"/>
  <text x="64" y="156" class="actor">Door actor</text>
  <line x1="270" y1="205" x2="1130" y2="205" class="track"/>
  <text x="250" y="211" text-anchor="end" class="lane">open (priority 10)</text>
  <line x1="270" y1="285" x2="1130" y2="285" class="track"/>
  <text x="250" y="291" text-anchor="end" class="lane">close (priority 5)</text>
  <line x1="270" y1="365" x2="1130" y2="365" class="track"/>
  <text x="250" y="371" text-anchor="end" class="lane">main (priority 0)</text>
  <line x1="430" y1="172" x2="430" y2="440" class="guide"/>
  <line x1="540" y1="172" x2="540" y2="440" class="guide"/>
  <line x1="880" y1="172" x2="880" y2="440" class="guide"/>
  <rect x="270" y="342" width="160" height="46" rx="8" class="run-main"/>
  <text x="350" y="372" text-anchor="middle" class="bar">main</text>
  <rect x="430" y="342" width="450" height="46" rx="8" class="suspended"/>
  <text x="655" y="372" text-anchor="middle" class="bar-quiet">中断中</text>
  <rect x="880" y="342" width="250" height="46" rx="8" class="run-main"/>
  <text x="1005" y="372" text-anchor="middle" class="bar">main（続きから）</text>
  <rect x="430" y="182" width="220" height="46" rx="8" class="run-open"/>
  <text x="540" y="212" text-anchor="middle" class="bar-light">open</text>
  <rect x="540" y="262" width="110" height="46" rx="8" class="waiting"/>
  <text x="595" y="292" text-anchor="middle" class="bar-quiet">待機</text>
  <rect x="650" y="262" width="230" height="46" rx="8" class="run-close"/>
  <text x="765" y="292" text-anchor="middle" class="bar">close</text>
  <line x1="270" y1="445" x2="1150" y2="445" stroke="#0f2547" stroke-width="3" marker-end="url(#m)"/>
  <text x="1150" y="475" text-anchor="end" class="small">時間</text>
  <circle cx="430" cy="172" r="18" fill="#3e92e8"/><text x="430" y="179" text-anchor="middle" class="badge">1</text>
  <circle cx="540" cy="172" r="18" fill="#3e92e8"/><text x="540" y="179" text-anchor="middle" class="badge">2</text>
  <circle cx="880" cy="172" r="18" fill="#3e92e8"/><text x="880" y="179" text-anchor="middle" class="badge">3</text>
  <circle cx="86" cy="540" r="18" fill="#3e92e8"/><text x="86" y="547" text-anchor="middle" class="badge">1</text>
  <text x="120" y="547" class="note">priority 10 の open が、実行中の main（priority 0）に割り込む</text>
  <circle cx="86" cy="602" r="18" fill="#3e92e8"/><text x="86" y="609" text-anchor="middle" class="badge">2</text>
  <text x="120" y="609" class="note">open の実行中に来た close（priority 5）は、open より低いので待つ</text>
  <circle cx="86" cy="664" r="18" fill="#3e92e8"/><text x="86" y="671" text-anchor="middle" class="badge">3</text>
  <text x="120" y="671" class="note">open と close が終わると、main が中断した場所から再開する</text>
</svg>
